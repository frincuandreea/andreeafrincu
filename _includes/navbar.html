<header class="portfolio-header">
  <a class="skipToContent" href="#main">Skip to main content</a>
  <div class="portfolio-container portfolio-header__inner">
    <a class="portfolio-brand" href="{{ '/' | relative_url }}" aria-label="Andreea Ciapsa home">
      <span class="portfolio-brand__name">Andreea Ciapsa</span>
      <span class="portfolio-brand__role">Senior Software Engineer &amp; AEM Consultant</span>
    </a>
    <button class="portfolio-nav-toggle" type="button" aria-expanded="false" aria-controls="portfolio-navigation" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav id="portfolio-navigation" class="portfolio-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/services/' | relative_url }}">Services</a>
      <a href="{{ '/blog/' | relative_url }}">Articles</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a class="portfolio-nav__cta" href="{{ '/contact/' | relative_url }}">Let's Work Together</a>
    </nav>
  </div>
</header>
<script>
(function () {
  var button = document.querySelector('.portfolio-nav-toggle');
  var nav = document.getElementById('portfolio-navigation');
  if (!button || !nav) return;
  button.addEventListener('click', function () {
    var open = button.getAttribute('aria-expanded') === 'true';
    button.setAttribute('aria-expanded', String(!open));
    nav.classList.toggle('portfolio-nav--open', !open);
  });
})();
</script>
